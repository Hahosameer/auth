<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container mt-5">
    <form action="#">
      <input type="email" id="uemail" placeholder="Email" class="form-control mb-3">
      <div class="password-container position-relative mb-3">
        <input type="password" id="upass" placeholder="Password" class="form-control" />
        <i class="fa-solid fa-eye toggle-password" id="togglePassword"></i>
      </div>
      <button type="button" onclick="login()" class="btn btn-primary w-100">Login</button>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
